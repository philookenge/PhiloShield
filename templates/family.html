<!DOCTYPE html>
<html lang="en">

<style>
    .mobile-menu-button {
        display: none;
    }

    @media (max-width: 768px) {
        .mobile-menu-button {
            display: block;
            width: 100%;
            padding: 12px;
            background: #397fba;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #mobileNavigation {
            display: none;
        }

        #mobileNavigation.menu-open {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    }
</style>


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Emergency Plan</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3">
</head>

<body>

    <button type="button" id="mobileMenuButton" class="mobile-menu-button" aria-label="Open navigation menu"
        aria-expanded="false" aria-controls="mobileNavigation">
        ☰ Menu
    </button>

    <nav class="navbar" id="mobileNavigation">
        <a href="/">🏠 Home</a>
        <a href="/shelter">🗺️ Nearby Safe Places</a>
        <a href="/alerts">🚨 Alerts</a>
        <a href="/kit">🎒 Emergency Kit</a>
        <a href="/family">👨‍👩‍👧 Family Plan</a>
        <a href="/contacts">☎️ Contacts</a>
        <a href="/share-app">📤 Share PhiloShield</a>
        <a href="/weather">🌧️ Weather</a>
        <a href="/sos">🆘 SOS</a>
        <a href="/firstaid">🩹 First Aid</a>
        <a href="/flashlight">🔦 Flashlight</a>
        <a href="/medicalid">🪪 Medical ID</a>
        <a href="/share">📍 Share Location</a>
        <a href="/assistant">🤖 AI Assistant</a>
    </nav>

    <div class="container">

        <div class="page-header">
            <h1>👨‍👩‍👧 Family Emergency Plan</h1>

            <p>
                Save important family emergency information.
            </p>
        </div>

        <section class="status-card">

            <label>Family Member</label>
            <input type="text" id="memberName">

            <br><br>

            <label>Phone Number</label>
            <input type="text" id="memberPhone">

            <br><br>

            <label>Meeting Place</label>
            <input type="text" id="meetingPlace">

            <br><br>

            <button id="savePlan">
                Save Plan
            </button>
            <div id="savedFamilyList"></div>
        </section>

    </div>
    <script src="{{ url_for('static', filename='js/family.js') }}"></script>

    <a href="{{ url_for('assistant') }}" class="ai-floating-button">
        <span class="ai-floating-icon">🤖</span>

        <span class="ai-floating-text">
            <strong>Hi!</strong>
            <span>I can assist you</span>
        </span>
    </a>

    <script>
        if (localStorage.getItem("philoDarkMode") === "enabled") {
            document.body.classList.add("dark-mode");
        }
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const menuButton = document.getElementById("mobileMenuButton");
            const mobileNavigation = document.getElementById("mobileNavigation");

            if (!menuButton || !mobileNavigation) return;

            menuButton.addEventListener("click", function () {
                const isOpen = mobileNavigation.classList.toggle("menu-open");

                menuButton.setAttribute("aria-expanded", String(isOpen));
                menuButton.setAttribute(
                    "aria-label",
                    isOpen ? "Close navigation menu" : "Open navigation menu"
                );

                menuButton.textContent = isOpen ? "✕ Close Menu" : "☰ Menu";
            });
        });
    </script>


</body>

</html>
